<!DOCTYPE html>
<html>
<head>
<body>
    <h2>Boolean JavaScript</h2>
    <p>Boolean hanya memiliki dua nilai: true dan false</p>
    <p id="demo"></p>
<script>
    var x = 5;
    var y = 5;
    var z = 6;
    document.getElementById("demo").innerHTML =
    (x == y) + "<br>" + (x == z);
</script>
</head>

</body>
</html>
